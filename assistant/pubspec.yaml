name: plant_assistant
description: Wires a plant's MCP tools to an LLM so a technician can ask in words and get answers built from real readings.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  mcp_client: ^2.1.0
  mcp_llm: ^2.1.1
  mcp_server: ^2.1.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
